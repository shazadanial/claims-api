server:
  port: 8085

spring:
  application:
    name: claims-api
  cloud:
    stream:
      kafka:
        binder:
          brokers: localhost:9092
          configuration:
            key.serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: org.apache.kafka.common.serialization.StringSerializer
      bindings:
        claims-out:
          destination: insurance-claims
          content-type: applica tion/json
          producer:
            partition-key-expression: headers['kafka_messageKey']
            partition-count: 3
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer

# NEW: Monitoring configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: claims-api
      environment: development
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    com.insurance: INFO
    org.springframework.cloud.stream: DEBUG